name: Update FACEIT stats
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch-stats.mjs
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stats.json
          git diff --staged --quiet || git commit -m "Update stats"
          git push
